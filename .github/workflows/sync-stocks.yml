# Amvera не ходит на AdvantShop:443. GitHub Actions не ходит на FTP 1С.
# Схема: Amvera (SYNC_UPLOAD_MODE=relay-github) → push data/stocks-latest.csv → этот workflow → admin.
name: Sync stocks (FTP → AdvantShop)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/stocks-latest.csv"

concurrency:
  group: sync-stocks
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Check secrets and stocks file
        env:
          ADVANTSHOP_ADMIN_EMAIL: ${{ secrets.ADVANTSHOP_ADMIN_EMAIL }}
          ADVANTSHOP_ADMIN_PASSWORD: ${{ secrets.ADVANTSHOP_ADMIN_PASSWORD }}
          ADVANTSHOP_ADMIN_URL: ${{ secrets.ADVANTSHOP_ADMIN_URL }}
        run: |
          missing=()
          for k in ADVANTSHOP_ADMIN_EMAIL ADVANTSHOP_ADMIN_PASSWORD; do
            if [ -z "${!k}" ]; then missing+=("$k"); fi
          done
          echo "ADVANTSHOP_ADMIN_EMAIL=${ADVANTSHOP_ADMIN_EMAIL:+set}"
          echo "ADVANTSHOP_ADMIN_PASSWORD=${ADVANTSHOP_ADMIN_PASSWORD:+set(len=${#ADVANTSHOP_ADMIN_PASSWORD})}"
          echo "ADVANTSHOP_ADMIN_URL=${ADVANTSHOP_ADMIN_URL:-MISSING}"
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi
          ls -la data/ || true
          if [ ! -f data/stocks-latest.csv ]; then
            echo "File missing after checkout — fetching from origin/main"
            git fetch origin main
            git checkout origin/main -- data/stocks-latest.csv || true
          fi
          if [ ! -f data/stocks-latest.csv ]; then
            echo "::error::data/stocks-latest.csv missing. Wait for Amvera relay-github commit."
            exit 1
          fi
          echo "stocks file: $(wc -c < data/stocks-latest.csv) bytes"

      - name: Run sync
        env:
          ADVANTSHOP_BASE_URL: ${{ secrets.ADVANTSHOP_BASE_URL || 'https://shop.synonym-jewelry.ru' }}
          ADVANTSHOP_SERVER_API_KEY: ${{ secrets.ADVANTSHOP_SERVER_API_KEY }}
          ADVANTSHOP_ADMIN_URL: ${{ secrets.ADVANTSHOP_ADMIN_URL }}
          ADVANTSHOP_ADMIN_EMAIL: ${{ secrets.ADVANTSHOP_ADMIN_EMAIL }}
          ADVANTSHOP_ADMIN_PASSWORD: ${{ secrets.ADVANTSHOP_ADMIN_PASSWORD }}
          SYNC_UPLOAD_MODE: admin
          SYNC_OUT_FORMAT: csv2
          SYNC_OUT_ENCODING: utf8
          SYNC_ADMIN_ONLY_UPDATE: "true"
          SYNC_POST_ENABLED: "true"
          SYNC_SKIP_IF_UNCHANGED: "true"
        run: node sync.mjs --file data/stocks-latest.csv
